version: "3.9"

# 通用配置: 环境变量、volumes

services:
  # ===== API: Python FastAPI + PaddleOCR + APScheduler =====
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: freight-api
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./logs:/app/logs
      - ./samples:/app/samples
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - freight-net

  # ===== Web: React + Vite build + nginx =====
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # v0.5: 前端调用 /api/v2 (nginx 反代到 api:8000)
        VITE_API_BASE: /api/v2
    container_name: freight-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - freight-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== 可选: PostgreSQL (生产用, 切换 DATABASE_URL 即可) =====
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: freight-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: freight
  #     POSTGRES_PASSWORD: freight_pwd
  #     POSTGRES_DB: freight
  #   volumes:
  #     - freight_pgdata:/var/lib/postgresql/data
  #   expose:
  #     - "5432"
  #   networks:
  #     - freight-net

networks:
  freight-net:
    driver: bridge

