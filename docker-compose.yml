version: "3.9"

services:
  api:
    build: .
    container_name: freight-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build: .
    container_name: freight-ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE: http://api:8000
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]

